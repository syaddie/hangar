# Every push to main builds Hangar for Windows and publishes it as a release here, which every installed Hangar
# finds, downloads and offers by itself (src/main/updates.ts). Each version is 0.1.<run number>, so it's always newer
# than the one before. Pull requests only run the checks.

name: Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Checks
        run: |
          npm run typecheck
          npm test

      - name: Number this version
        if: github.event_name != 'pull_request'
        shell: bash
        run: npm version --no-git-tag-version "0.1.${{ github.run_number }}"

      - name: Build and publish
        if: github.event_name != 'pull_request'
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
